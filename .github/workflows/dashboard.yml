name: Refresh portfolio dashboard

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - dashboard/**
      - .github/workflows/dashboard.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate portfolio dashboard
        run: python dashboard/dashboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh portfolio dashboard"
          git push
